# Copy this file and set fresh, explicit paths. A full DeepAction bundle is not
# supplied by this repository; do not claim these placeholder paths are ready.
run:
  output_dir: /fresh/outside-checkout/native-wpp-run

data:
  packed_bundle: /fresh/outside-checkout/wpp-bounded-v1
  source_manifest: /path/to/approved-source-manifest
  index: /path/to/native-build/extraction-index

model:
  kind: wpp_transformer
  patch_size: 16
  d_model: 32
  nhead: 4
  num_layers: 2
  dim_feedforward: 64
  dropout: 0.2

training:
  seed: 42
  learning_rate: 0.001
  batch_size: 1
  max_epochs: 300
  optimizer: Adam
  checkpoint_frequency: 1
  device: auto
  num_workers: 0
  early_stopping:
    patience: 25
    min_improvement: 0.001
  scheduler:
    factor: 0.1
    patience: 10
    min_lr: 0.00001

preprocessing:
  method: global_valid_train_zscore
  statistics_dtype: float64
  standard_deviation: population
  ddof: 0
  fit_split: train
  valid_cells: explicit_row_mask_and_time_mask
  observed_zero: included
  padding: zero
  log_transform: null
  clipping: null
  per_row_normalization: false
