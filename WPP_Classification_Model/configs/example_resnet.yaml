# ResNet template for caller-prepared Gait CSV splits. These six external files
# are not created by this project; their data rows may reference the exported NPZs.
run:
  output_root: /mnt/d/projects/proj-entropy/wpp_model_runs
  name: gait_resnet

data:
  train_data_path: /mnt/d/projects/proj-entropy/gait_wpp_outputs/training_data.csv
  train_label_path: /mnt/d/projects/proj-entropy/gait_wpp_outputs/training_labels.csv
  val_data_path: /mnt/d/projects/proj-entropy/gait_wpp_outputs/val_data.csv
  val_label_path: /mnt/d/projects/proj-entropy/gait_wpp_outputs/val_labels.csv
  test_data_path: /mnt/d/projects/proj-entropy/gait_wpp_outputs/test_data.csv
  test_label_path: /mnt/d/projects/proj-entropy/gait_wpp_outputs/test_labels.csv

# No classes.class_names: infer sorted canonical raw person-ID labels from train only.
model:
  architecture: resnet
  # Exact native-PTS window width in seconds.
  window_seconds: 2
  width: 64
  resnet_blocks: 3
  dropout: 0.1

training:
  seed: 0
  learning_rate: 0.001
  batch_size: 2
  gradient_accumulation: 8
  max_epochs: 100
  patience: 15
  class_weights: none
  monitor: macro_f1
  device: cuda
  amp: true
