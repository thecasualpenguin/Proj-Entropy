# Validated defaults. ResNet remains the default architecture.
run:
  output_root: runs
  name: null
data:
  mode: auto
  data_path: null
  label_path: null
  train_data_path: null
  train_label_path: null
  val_data_path: null
  val_label_path: null
  test_data_path: null
  test_label_path: null
model:
  architecture: resnet
  initial_feature_maps: 128
  # For architecture: transformer, replace initial_feature_maps with:
  # patch_size: 16, d_model: 32, nhead: 4, num_layers: 2,
  # dim_feedforward: 64, dropout: 0.2, length_aware: true
training:
  seed: 42
  learning_rate: 0.001
  batch_size: 64
  max_epochs: 300
  optimizer: Adam
  class_imbalance: none
  early_stopping:
    monitor: validation_loss
    patience: 25
    min_improvement: 0.001
  scheduler:
    factor: 0.1
    patience: 10
    min_lr: 0.00001
  checkpoint_frequency: 1
  device: auto
  num_workers: 0
preprocessing:
  method: per_sequence_zscore
  sequence_length: 3000
  standard_deviation: population
  epsilon: null
